name: Apply update

# 手動実行専用: GitHubの Actions タブ → 「Apply update」 → Run workflow
# リポジトリ直下の update.zip を展開して、中のファイルを元のフォルダ構成のまま一括で上書きし、
# 1回のコミットにまとめます。成功すると update.zip は自動で削除されます。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply update.zip
        run: |
          if [ ! -f update.zip ]; then
            echo "update.zip がありません。何もしません。"
            exit 0
          fi
          unzip -o update.zip -d .
          # 以前の版で使っていて、今は不要なファイル(無ければ何もしない)
          rm -f app/api/admin/login/route.ts
          rm -f app/api/admin/logout/route.ts
          rm -f app/api/admin/password/route.ts
          rm -f app/admin/login/page.tsx
          # 置き場所を間違えて残っていた不要ファイル
          rm -f lib/login/page.tsx
          rm -f lib/usercheck.ts
          rm -f update.zip

      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更はありません。"
            exit 0
          fi
          git commit -m "Apply update"
          git push
